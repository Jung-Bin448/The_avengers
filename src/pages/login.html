<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Level Up Life - Login</title>

    <!-- CSS -->
<link rel="stylesheet" href="../assests/css/Style.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="login-container">

        <!-- Profile Icon -->
        <div class="profile-icon">
            <i class="fa-regular fa-user"></i>
        </div>

        <h1>Login</h1>


        <!-- Email -->
        <div class="input-group">

            <div class="label-row">
                <label for="email">Email</label>

                <a href="#" class="forgot-password">
                    Forgot password?
                </a>
            </div>

            <div class="input-box">
                <i class="fa-regular fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >
            </div>

        </div>


        <!-- Password -->
        <div class="input-group">

            <div class="label-row">
                <label for="password">Password</label>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >
            </div>

        </div>


        <!-- Login Button -->
        <button class="login-button" id="loginButton">
            Log In
        </button>


        <!-- Divider -->
        <div class="divider">
            <span>or continue with</span>
        </div>


        <!-- Social Login -->
        <div class="social-login">

            <button class="social-button" id="googleButton">
                <i class="fa-brands fa-google google-icon"></i>
            </button>

            <button class="social-button" id="facebookButton">
                <i class="fa-brands fa-facebook-f facebook-icon"></i>
            </button>

        </div>


        <!-- Sign Up -->
        <div class="register">
            <span>Not register yet?</span>

            <a href="#" id="signupLink">
                Sign Up&gt;
            </a>
        </div>

    </div>


    <!-- JavaScript -->
<script src="../assests/js/app.js"></script>

</body>
</html>
